<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoor Vidéo</title>
    <!-- Anti-flash : le thème est posé avant le premier rendu, jamais après. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var s = localStorage.getItem('ui-scale');
          if (s) document.documentElement.style.setProperty('--ui-scale', s);
        } catch (e) {
          /* mode privé, stockage bloqué : le repli CSS suffit */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
